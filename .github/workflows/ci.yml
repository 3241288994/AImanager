name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm -C apps install --frozen-lockfile
      - name: Lint maintained frontend surface
        run: pnpm -C apps run lint
      - name: Build static frontend
        run: pnpm -C apps run build:desktop
      - name: Run maintained runtime tests
        run: pnpm -C apps run test:runtime
      - name: Install Chromium for browser regression tests
        run: pnpm -C apps exec playwright install --with-deps chromium
      - name: Run browser regression tests
        run: pnpm -C apps run test:e2e

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate manifests
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Run workspace tests
        # Service tests temporarily select isolated SQLite databases through
        # process-wide environment variables, so they must not run concurrently.
        run: cargo test --workspace --locked -- --test-threads=1

  desktop-shell:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate desktop manifest
        run: cargo metadata --manifest-path apps/src-tauri/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
      - name: Run Tauri command and updater tests
        # Home-directory selection tests modify process-wide environment variables.
        run: cargo test --manifest-path apps/src-tauri/Cargo.toml --locked --lib -- --test-threads=1

  labcontext-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labcontext-provider/pyproject.toml
      - name: Install Provider and test dependencies
        run: python -m pip install './labcontext-provider[dev]'
      - name: Run Provider tests
        run: python -m pytest -q labcontext-provider/tests

  public-release-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run source and secret preflight
        run: scripts/open-source/preflight.sh
